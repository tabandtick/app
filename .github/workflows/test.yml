# Runs the tests in tests/, in headless Chrome, on every push and pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A local Tab & Tick server, with just what shared lists use
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Start the local server
        run: supabase start -x studio,storage-api,imgproxy,edge-runtime,logflare,vector,mailpit,supavisor,postgres-meta
      - name: Check its rules
        run: docker exec -i supabase_db_tabandtick psql -U postgres -v ON_ERROR_STOP=1 -q -o /dev/null < supabase/tests/shared_lists.sql
      # The sync that keeps shared lists matched across everyone's Google Tasks
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test the sync
        run: deno test -A supabase/tests/copies.test.ts
      - name: Run the tests
        run: node tests/app.test.mjs && node tests/shared.test.mjs
