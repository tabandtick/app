# Runs the tests in tests/, in headless Chrome, on every push and pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run the tests
        run: node tests/app.test.mjs && node tests/shared.test.mjs
