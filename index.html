<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tab &amp; Tick</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A fast to-do list in your new tab. Works with Google Tasks.">
    <link rel="icon" href="icons/icon-32.png" type="image/png">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header id="header">
      <button type="button" id="side-toggle" aria-label="Lists">&#9776;</button>
      <img src="icons/logo.svg" width="32" height="32" alt="">
      <h1>Tab &amp; Tick</h1>
      <div id="status">Loading&hellip;</div>
      <div id="authorize-div" style="display:none"><button type="button" id="authorize-button">Log in</button></div>
      <button type="button" id="log-out-button">Log out</button>
    </header>

    <nav id="side" aria-label="Lists">
      <button type="button" id="create"><span aria-hidden="true">+</span> New task</button>
      <button type="button" id="all-lists">All lists</button>
      <h2>Lists</h2>
      <ul id="lists"></ul>
      <button type="button" id="new-list"><span aria-hidden="true">+</span> New list</button>
    </nav>

    <main>
      <div id="welcome">
        <h2>A fast to-do list in your new tab</h2>
        <p>Works with Google Tasks. Log in to see your tasks.</p>
      </div>
      <p id="none-shown">All your lists are hidden. Tick one in the sidebar to show it.</p>
      <div id="cards"></div>
    </main>

    <div id="card-template" hidden>
      <section class="card">
        <div class="card-head">
          <input type="text" class="list-title" aria-label="List name" maxlength="1024" spellcheck="false">
          <button type="button" class="more" aria-label="List options" aria-haspopup="true" aria-expanded="false">&#8942;</button>
          <div class="menu" role="menu">
            <button type="button" role="menuitem" data-list-do="rename">Rename</button>
            <button type="button" role="menuitem" data-list-do="hide">Hide</button>
            <button type="button" role="menuitem" data-list-do="delete">Delete list</button>
          </div>
        </div>
        <button type="button" class="new-task"><span aria-hidden="true">+</span> Add a task</button>
        <p class="note"></p>

        <ul class="list claire"></ul>

        <div class="empty">
          <svg width="180" height="132" viewBox="0 0 180 132" fill="none" aria-hidden="true">
            <rect x="30" y="6" width="120" height="120" rx="12" fill="var(--tint)"/>
            <rect x="46" y="26" width="20" height="20" rx="10" fill="var(--accent)"/>
            <path d="M51 36l4 4 7-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M78 36h54" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>
            <rect x="46" y="56" width="20" height="20" rx="10" fill="var(--accent)"/>
            <path d="M51 66l4 4 7-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M78 66h38" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>
            <rect x="47.500" y="87.500" width="17" height="17" rx="8.500" stroke="var(--accent)" stroke-width="3" stroke-dasharray="5 4"/>
            <path d="M78 96h20" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
            <path d="M108 88v16" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <h2>Nothing to do</h2>
          <p>Add a task to get started.</p>
          <button type="button" class="empty-new">Add a task</button>
        </div>

        <div class="done">
          <button type="button" class="done-toggle" aria-expanded="false">Completed</button>
          <div class="done-body">
            <ul class="list done-list"></ul>
            <p class="done-none">Nothing completed yet</p>
            <button type="button" class="done-more">Load more</button>
          </div>
        </div>
      </section>
    </div>

    <dialog id="dialog">
      <form>
        <h2></h2>
        <p></p>
        <input type="text" maxlength="1024" aria-label="Name">
        <div class="buttons">
          <button type="button" class="cancel">Cancel</button>
          <button type="submit" class="ok"></button>
        </div>
      </form>
    </dialog>

    <div id="drop-line"></div>
    <div id="message" role="status"><span></span> <button type="button"></button></div>

    <script src="jquery.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script src="tasks.js"></script>
  </body>
</html>
